spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: nforce-sync

  datasource:
    url: jdbc:postgresql://ep-curly-block-az1o59ol.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gBPETcD1Zb3m
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      # Sized for the larger of the two attachment features: EOD attachments cap at 10 MB/file
      # (app.eod-attachment.max-file-size-bytes below); Blocker replies still enforce their own
      # 5 MB/file, 4 files/reply. Headroom here just needs to be >= the largest of those so
      # Spring's own limit is never hit before either feature's own validation runs.
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # CHANGE IN PRODUCTION — move to environment variable JWT_SECRET, min 32 chars for HS256
    secret: "nforce-sync-dev-only-secret-key-change-this-in-prod-env-var-32chars+"
  # Fallback only — used when a request carries no recognisable Origin (e.g. the scheduled EOD
  # reminder job). Live requests get the origin they came from, via AppBaseUrlResolver.
  base-url: http://localhost:5173
  cors:
    # Comma-separated. Doubles as the allow-list for links in emails: a password reset requested
    # from the deployed site links back to that site, one from local dev links to localhost.
    # Override per environment with FRONTEND_URL.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,https://nforce-sync-git-dev-nforce-one.vercel.app}
  # EOD Supporting Attachments — change these to retune limits, no code change needed.
  # Mirrored on the frontend in lib/eodAttachments.ts's own constants; keep both sides in sync.
  eod-attachment:
    max-file-size-bytes: 10485760      # 10 MB per file
    max-attachments-per-entry: 10      # EOD-level cap
    max-attachments-per-task: 5        # per-task cap
    # App-wide circuit breaker on TOTAL bytes stored across every EOD attachment row (a plain
    # bytea column — see EodAttachment.data), independent of the per-file/per-entry caps above,
    # which only bound one upload at a time and do nothing to stop unbounded growth across every
    # employee over months of use. 2 GB is a starting guess, not a measured quota: comfortably
    # above what routine EOD attachment usage (occasional screenshots/PDFs, capped at 10 MB each)
    # should accumulate even across a full team over months, while still acting as a real backstop
    # protecting the shared Postgres instance from runaway growth. Re-tune from real usage once
    # this has been live a while — see EodAttachmentService.assertStorageAvailable.
    max-total-storage-bytes: 2147483648   # 2 GB

resend:
  api-key: ${RESEND_API_KEY:}
  from: NForce Sync <onboarding@nforceone.com>

logging:
  level:
    org.hibernate.SQL: WARN
